[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mas-2026"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "jinja2>=3.1.6",
    "joblib>=1.5.3",
    "numpy",
    "pandas",
    "pydantic",
    "optuna",
    "scikit-learn>=1.3.0",
    
    
    "xgboost>=1.7.5",
    "uvicorn",
]
[project.scripts]
app = "house_price_prediction.webapp.main:start"
predict-prices = "house_price_prediction.cli:main"
serve-app = "house_price_prediction.webapp.main:start"
generate-visuals = "house_price_prediction.generate_visuals:generate_plots"

[tool.hatch.build.targets.wheel]
packages = ["src/house_price_prediction"]
